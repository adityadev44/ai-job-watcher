name: Aviation MRO Job Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false   # let an in-flight run finish/commit rather than losing its state

jobs:
  run-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a single hung fetcher must not block state-save for 6h (GitHub's default)

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install pip requirements
        run: pip install -r requirements.txt

      - name: Cache Playwright Firefox
        id: cache-firefox
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Firefox (Playwright)
        if: steps.cache-firefox.outputs.cache-hit != 'true'
        run: playwright install firefox

      - name: Verify Firefox binary (repair corrupted cache)
        run: |
          if ! find ~/.cache/ms-playwright -type f -path "*/firefox/firefox" 2>/dev/null | grep -q .; then
            echo "Firefox binary missing despite cache restore — reinstalling"
            playwright install firefox
          fi

      - name: Install Firefox system dependencies
        run: playwright install-deps firefox

      - name: Run all pipelines (parallel)
        run: |
          timeout 300 python -u -m src.run_safran &
          pid1=$!
          timeout 300 python -u -m src.run_ge &
          pid2=$!
          timeout 300 python -u -m src.run_sanad &
          pid3=$!
          timeout 300 python -u -m src.run_emirates &
          pid4=$!
          timeout 300 python -u -m src.run_gmr &
          pid5=$!
          timeout 300 python -u -m src.run_rtx &
          pid6=$!
          timeout 300 python -u -m src.run_indigo &
          pid7=$!
          timeout 300 python -u -m src.run_etihad &
          pid8=$!
          timeout 300 python -u -m src.run_sia &
          pid9=$!
          timeout 300 python -u -m src.run_ste &
          pid10=$!
          timeout 300 python -u -m src.run_standardaero &
          pid11=$!
          timeout 300 python -u -m src.run_saudia_technic &
          pid12=$!
          timeout 300 python -u -m src.run_lht &
          pid13=$!
          timeout 300 python -u -m src.run_qatar &
          pid14=$!
          timeout 300 python -u -m src.run_ethiopian &
          pid15=$!
          timeout 300 python -u -m src.run_gatelesis &
          pid16=$!
          timeout 300 python -u -m src.run_fltechnics &
          pid17=$!
          timeout 300 python -u -m src.run_magnetic &
          pid18=$!
          timeout 300 python -u -m src.run_air_india &
          pid20=$!
          timeout 300 python -u -m src.run_dgca &
          pid21=$!
          timeout 300 python -u -m src.run_saesl &
          pid22=$!
          timeout 300 python -u -m src.run_oman_air &
          pid23=$!
          timeout 300 python -u -m src.run_gulf_air &
          pid24=$!
          timeout 300 python -u -m src.run_kuwait_airways &
          pid25=$!
          timeout 300 python -u -m src.run_ammroc &
          pid26=$!
          timeout 300 python -u -m src.run_wlfc &
          pid37=$!
          timeout 300 python -u -m src.run_elfc &
          pid38=$!
          timeout 300 python -u -m src.run_rolls_royce &
          pid27=$!
          timeout 300 python -u -m src.run_honeywell &
          pid28=$!
          timeout 300 python -u -m src.run_mtu &
          pid29=$!
          timeout 300 python -u -m src.run_boeing &
          pid30=$!
          timeout 300 python -u -m src.run_aar &
          pid31=$!
          timeout 300 python -u -m src.run_icf &
          pid32=$!
          timeout 300 python -u -m src.run_oliver_wyman &
          pid34=$!
          timeout 300 python -u -m src.run_smbc_aviation &
          pid41=$!
          timeout 300 python -u -m src.run_aercap &
          pid40=$!
          timeout 300 python -u -m src.run_avolon &
          pid42=$!
          timeout 300 python -u -m src.run_boc_aviation &
          pid43=$!
          timeout 300 python -u -m src.run_acg &
          pid44=$!
          wait $pid1
          s1=$?
          wait $pid2
          s2=$?
          wait $pid3
          s3=$?
          wait $pid4
          s4=$?
          wait $pid5
          s5=$?
          wait $pid6
          s6=$?
          wait $pid7
          s7=$?
          wait $pid8
          s8=$?
          wait $pid9
          s9=$?
          wait $pid10
          s10=$?
          wait $pid11
          s11=$?
          wait $pid12
          s12=$?
          wait $pid13
          s13=$?
          wait $pid14
          s14=$?
          wait $pid15
          s15=$?
          wait $pid16
          s16=$?
          wait $pid17
          s17=$?
          wait $pid18
          s18=$?
          wait $pid20
          s20=$?
          wait $pid21
          s21=$?
          wait $pid22
          s22=$?
          wait $pid23
          s23=$?
          wait $pid24
          s24=$?
          wait $pid25
          s25=$?
          wait $pid26
          s26=$?
          wait $pid37
          s37=$?
          wait $pid38
          s38=$?
          wait $pid27
          s27=$?
          wait $pid28
          s28=$?
          wait $pid29
          s29=$?
          wait $pid30
          s30=$?
          wait $pid31
          s31=$?
          wait $pid32
          s32=$?
          wait $pid34
          s34=$?
          wait $pid41
          s41=$?
          wait $pid40
          s40=$?
          wait $pid42
          s42=$?
          wait $pid43
          s43=$?
          wait $pid44
          s44=$?
          exit $((s1 | s2 | s3 | s4 | s5 | s6 | s7 | s8 | s9 | s10 | s11 | s12 | s13 | s14 | s15 | s16 | s17 | s18 | s20 | s21 | s22 | s23 | s24 | s25 | s26 | s37 | s38 | s27 | s28 | s29 | s30 | s31 | s32 | s34 | s40 | s41 | s42 | s43 | s44))

      - name: Save state to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs_safran.json \
                  seen_jobs_ge.json \
                  seen_jobs_sanad.json \
                  seen_jobs_emirates.json \
                  seen_jobs_gmr.json \
                  seen_jobs_rtx.json \
                  seen_jobs_indigo.json \
                  seen_jobs_etihad.json \
                  seen_jobs_sia.json \
                  seen_jobs_ste.json \
                  seen_jobs_standardaero.json \
                  seen_jobs_saudia_technic.json \
                  seen_jobs_lht.json \
                  seen_jobs_qatar.json \
                  seen_jobs_ethiopian.json \
                  seen_jobs_gatelesis.json \
                  seen_jobs_fltechnics.json \
                  seen_jobs_magnetic.json \
                  seen_jobs_air_india.json \
                  seen_jobs_dgca.json \
                  seen_jobs_saesl.json \
                  seen_jobs_oman_air.json \
                  seen_jobs_gulf_air.json \
                  seen_jobs_kuwait_airways.json \
                  seen_jobs_ammroc.json \
                  seen_jobs_wlfc.json \
                  seen_jobs_elfc.json \
                  seen_jobs_rolls_royce.json \
                  seen_jobs_honeywell.json \
                  seen_jobs_mtu.json \
                  seen_jobs_boeing.json \
                  seen_jobs_aar.json \
                  seen_jobs_icf.json \
                  seen_jobs_oliver_wyman.json \
                  seen_jobs_smbc_aviation.json \
                  seen_jobs_aercap.json \
                  seen_jobs_avolon.json \
                  seen_jobs_boc_aviation.json \
                  seen_jobs_acg.json
          test -f pipeline_failures.json && git add pipeline_failures.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit — state unchanged"
          else
            git commit -m "chore: update job state [skip ci]"
            git push
          fi
