name: Aviation MRO Job Watcher

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false   # let an in-flight run finish/commit rather than losing its state

jobs:
  run-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a single hung fetcher must not block state-save for 6h (GitHub's default)

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install pip requirements
        run: pip install -r requirements.txt

      - name: Cache Playwright Firefox
        id: cache-firefox
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Firefox (Playwright)
        if: steps.cache-firefox.outputs.cache-hit != 'true'
        run: playwright install firefox

      - name: Verify Firefox binary (repair corrupted cache)
        run: |
          if ! find ~/.cache/ms-playwright -type f -path "*/firefox/firefox" 2>/dev/null | grep -q .; then
            echo "Firefox binary missing despite cache restore — reinstalling"
            playwright install firefox
          fi

      - name: Install Firefox system dependencies
        run: playwright install-deps firefox

      - name: Run all pipelines (parallel)
        run: python -u -m src.run_all

      - name: Save state to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs_safran.json \
                  seen_jobs_ge.json \
                  seen_jobs_sanad.json \
                  seen_jobs_emirates.json \
                  seen_jobs_gmr.json \
                  seen_jobs_rtx.json \
                  seen_jobs_indigo.json \
                  seen_jobs_etihad.json \
                  seen_jobs_sia.json \
                  seen_jobs_ste.json \
                  seen_jobs_standardaero.json \
                  seen_jobs_saudia_technic.json \
                  seen_jobs_lht.json \
                  seen_jobs_qatar.json \
                  seen_jobs_ethiopian.json \
                  seen_jobs_gatelesis.json \
                  seen_jobs_fltechnics.json \
                  seen_jobs_magnetic.json \
                  seen_jobs_air_india.json \
                  seen_jobs_dgca.json \
                  seen_jobs_saesl.json \
                  seen_jobs_oman_air.json \
                  seen_jobs_gulf_air.json \
                  seen_jobs_kuwait_airways.json \
                  seen_jobs_ammroc.json \
                  seen_jobs_wlfc.json \
                  seen_jobs_elfc.json \
                  seen_jobs_rolls_royce.json \
                  seen_jobs_honeywell.json \
                  seen_jobs_mtu.json \
                  seen_jobs_boeing.json \
                  seen_jobs_aar.json \
                  seen_jobs_icf.json \
                  seen_jobs_oliver_wyman.json \
                  seen_jobs_smbc_aviation.json \
                  seen_jobs_aercap.json \
                  seen_jobs_avolon.json \
                  seen_jobs_boc_aviation.json \
                  seen_jobs_acg.json
          test -f pipeline_failures.json && git add pipeline_failures.json || true
          test -f pipeline_health.json && git add pipeline_health.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit — state unchanged"
          else
            git commit -m "chore: update job state [skip ci]"
            git push
          fi
