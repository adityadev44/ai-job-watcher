name: Aviation MRO Job Watcher

on:
  # Primary cadence: the Heartbeat workflow (hourly cron) completes in
  # seconds, and its completion fires this workflow_run trigger. GitHub's
  # native `schedule:` trigger on THIS workflow was observed firing every
  # 4-7h instead of the configured 3h (documented GitHub Actions platform
  # behavior: scheduled workflows are best-effort and get delayed/dropped
  # under load) -- routing cadence through a separate, trivial workflow
  # sidesteps that. Same pattern already proven in ms-job-watcher.
  workflow_run:
    workflows: ["Heartbeat"]
    types: [completed]

  workflow_dispatch:

  # Backup schedule: guards against GitHub cron delays on the Heartbeat
  # workflow itself. Kept at the original 3h interval -- Heartbeat is the
  # primary driver now, this is just insurance.
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false   # let an in-flight run finish/commit rather than losing its state

jobs:
  run-watcher:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # a single hung fetcher must not block state-save for 6h (GitHub's default)

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync to latest master
        # actions/checkout pins the SHA at run-creation time, not job-start
        # time. With Heartbeat now driving cadence, queued runs must
        # fast-forward past any state commit made while they waited, or a
        # queued run starts from stale dedup state and can re-alert jobs
        # already sent minutes earlier (exact failure ms-job-watcher hit
        # before this same fix was added there).
        run: git pull --ff-only origin master

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install pip requirements
        run: pip install -r requirements.txt

      - name: Cache Playwright Firefox
        id: cache-firefox
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-v2-${{ hashFiles('requirements.txt') }}

      - name: Install Firefox (Playwright)
        if: steps.cache-firefox.outputs.cache-hit != 'true'
        run: playwright install firefox

      - name: Verify Firefox binary (repair corrupted or stale-version cache)
        run: |
          # A file existing under */firefox/firefox is not enough -- a stale
          # cache (browser build left over from a previously-installed,
          # unpinned playwright version) satisfies that check while still
          # being the wrong build for the *currently installed* playwright
          # package, which fails at launch with "Executable doesn't exist at
          # <expected-build-path>". Actually launch it to catch that case.
          if ! python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.firefox.launch(headless=True)
              b.close()
          " 2>/dev/null; then
            echo "Firefox binary missing or wrong build for the installed playwright version — reinstalling"
            playwright install firefox
          fi

      - name: Install Firefox system dependencies
        run: playwright install-deps firefox

      - name: Run all pipelines (parallel)
        run: python -u -m src.run_all

      - name: Save state to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs_safran.json \
                  seen_jobs_ge.json \
                  seen_jobs_sanad.json \
                  seen_jobs_emirates.json \
                  seen_jobs_gmr.json \
                  seen_jobs_rtx.json \
                  seen_jobs_indigo.json \
                  seen_jobs_etihad.json \
                  seen_jobs_sia.json \
                  seen_jobs_ste.json \
                  seen_jobs_standardaero.json \
                  seen_jobs_saudia_technic.json \
                  seen_jobs_lht.json \
                  seen_jobs_qatar.json \
                  seen_jobs_ethiopian.json \
                  seen_jobs_gatelesis.json \
                  seen_jobs_fltechnics.json \
                  seen_jobs_magnetic.json \
                  seen_jobs_air_india.json \
                  seen_jobs_dgca.json \
                  seen_jobs_saesl.json \
                  seen_jobs_oman_air.json \
                  seen_jobs_gulf_air.json \
                  seen_jobs_kuwait_airways.json \
                  seen_jobs_ammroc.json \
                  seen_jobs_wlfc.json \
                  seen_jobs_elfc.json \
                  seen_jobs_rolls_royce.json \
                  seen_jobs_honeywell.json \
                  seen_jobs_mtu.json \
                  seen_jobs_boeing.json \
                  seen_jobs_aar.json \
                  seen_jobs_icf.json \
                  seen_jobs_oliver_wyman.json \
                  seen_jobs_smbc_aviation.json \
                  seen_jobs_aercap.json \
                  seen_jobs_avolon.json \
                  seen_jobs_boc_aviation.json \
                  seen_jobs_acg.json \
                  seen_jobs_delta.json
          test -f pipeline_failures.json && git add pipeline_failures.json || true
          test -f pipeline_health.json && git add pipeline_health.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit — state unchanged"
          else
            git commit -m "chore: update job state [skip ci]"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase origin master && git push; then
                pushed=1
                break
              fi
              echo "push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "::error::Failed to push watcher state after 3 attempts -- dedup state was NOT saved; expect duplicate alerts next run."
              exit 1
            fi
          fi
