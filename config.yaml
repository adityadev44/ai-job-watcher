# since the description is assembled client-side. ~141 US jobs, dominated by
# "Aircraft Maintenance Technician" (excluded by Gate 3). Aviation-domain
# title pre-filter in pipeline_registry.py exists purely to bound the number
# of expensive per-job Playwright renders — Gate 2 itself is fully active
# (real descriptions available, not bypassed).
delta_search:
  max_listings: 150
  inter_page_delay: 0.3
  note: "Avature behind AWS WAF challenge; Playwright required; listing pages server-rendered, detail pages need real render for description."

