    - "engine"
    - "engines"
    - "mro"
    - "shop"
    - "technical services"
    - "instructor"
    - "overhaul"
    - "camo"
    - "continuing airworthiness"
  exclude_terms:
    - "technician"
    - "apprentice"
    - "trainee"
    - "intern"
    - "fresher"
    - "graduate"
    - "new grad"
    - "software"
    - "it"
    - "avionics"
    - "cabin"
    - "pilot"
    - "finance"
    - "sales"
    - "structures"
    - "airframe"
    - "hr"
    - "human resources"
    - "coordinator"
    - "mechanic"
    - "inspector"
    - "talent acquisition"
    - "warehousing"
    - "asset management"
    - "dnata"
    - "skillbridge"
    - "operator"
    - "construction"
  engine_specific_terms:
    - "GE90"
    - "GEnx"
    - "PW4000"
    - "CF6"
    - "CFM56"
    - "LEAP"
    - "GTF"
    - "PW1100"
    - "Trent"
    - "V2500"
    - "engine overhaul"
    - "test cell"
    - "borescope"
    - "shop visit"
    - "workscope"
    - "CAMO"
    - "Part-M"
    - "continuing airworthiness"
    - "LLP"
    - "on-wing"
    - "engine ground run"
  domain_terms:
    - "maintenance"
    - "repair"
    - "overhaul"
    - "powerplant"
    - "propulsion"
    - "airworthiness"
    - "EASA"
    - "FAA"
    - "DGCA"
    - "GCAA"
    - "GACA"
    - "aviation"
    - "aerospace"
    - "aircraft"
    - "airline"
    - "AME"
    - "AMO"
    - "MRO"
    - "SMS"
    - "human factors"
    - "Part 145"
    - "CAR 145"
    - "CRS"
  description_exclude_terms:
    # Original phrases (kept for direct substring match)
    - "u.s. citizenship required"
    - "must be a u.s. citizen"
    - "us citizenship required"
    - "u.s. citizens only"
    - "us citizens only"
    - "u.s. persons only"
    - "us persons only"
    # Added: "is required" / "are required" connector variants (substring ≠ regex)
    - "u.s. citizenship is required"
    - "us citizenship is required"
    # Added: ITAR / US-person restriction phrases
    - "only u.s. citizens are authorized"
    - "only us citizens are authorized"
    - "authorized to access information under this program"
    - "must be a u.s. person"
    - "u.s. person status"
    # Note: matcher.py _GATE4_CITIZENSHIP_RE also catches these patterns via regex,
    # providing structural coverage beyond what literal substring matching can express.

